  gitUsername: RaviSK0509
  gitBranch: main
- name: WmSalesforceProvider
  wpmServer: https://packages.webmethods.io
  wpmRegistry: supported
services:
- serviceName: project.listenersgit.WmSalesforceProvider.com_webmethods_cloudstreams_salesforce_v53.connections:soapGitbasic
