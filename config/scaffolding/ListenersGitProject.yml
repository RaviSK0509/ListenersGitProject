    version: "1.0"
  - name: WmSalesforceProvider
    version: 12.0.0.0.25
- serviceName: project.listenersgit.integrations:pushEventGit
  packages:
  - name: ListenersGitProject
    version: "1.0"
  - name: WmSalesforceProvider
    version: 12.0.0.0.25
- serviceName: pub.flow:tracePipeline
  packages:
  - name: WmPublic
    version: 12.1.0.0.1328
configurationVariables:
  jdbcfunc.SAPTxStore.failFastMode: false
  jdbcfunc.SAPTxStore.connPoolAlias: SAP TxStore Pool
